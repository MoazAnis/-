<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة المستحقات السنوية-By:Eng.Moaz Omar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap');
        body { 
            font-family: 'Noto Sans Arabic', sans-serif; 
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }
        .gold-border { border-color: #d4af37; }
        .gold-text { color: #d4af37; }
        .bg-royal { background-color: #1e293b; }
        .animate-slide-in {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // مكون أيقونة مخصص
        const Icon = ({ name, className = "w-6 h-6" }) => {
            const icons = {
                calculator: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="4" y="2" width="16" height="20" rx="2"/><rect x="8" y="6" width="8" height="4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>,
                calendar: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
                banknote: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="12" cy="12" r="2"/></svg>,
                ticket: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 9c0-1 1-2 2-2h16c1 0 2 1 2 2v6c0 1-1 2-2 2H4c-1 0-2-1-2-2V9z"/><path d="M8 9v6M16 9v6"/></svg>,
                clock: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
                info: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>,
                userCheck: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>,
                user: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
                shieldCheck: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 12 15 15 9"/></svg>,
                download: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
            };
            return icons[name] || null;
        };

        const App = () => {
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [totalSalary, setTotalSalary] = useState('');
            const [entitlementType, setEntitlementType] = useState('21');
            const [customDays, setCustomDays] = useState('');
            const [ticketPrice, setTicketPrice] = useState('');
            const [results, setResults] = useState(null);

            const calculateVacation = () => {
                if (!startDate || !endDate || !totalSalary) return;

                const start = new Date(startDate);
                const end = new Date(endDate);
                const salary = parseFloat(totalSalary);
                const ticket = ticketPrice ? parseFloat(ticketPrice) : 0;
                
                const annualDays = entitlementType === 'custom' ? parseFloat(customDays) : parseInt(entitlementType);
                
                if (isNaN(annualDays) || annualDays <= 0) return;

                const diffTime = Math.abs(end - start);
                const totalDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1; 

                const dailyRate = salary / 30;
                const accruedDays = (totalDays / 365) * annualDays;
                const compensationAmount = accruedDays * dailyRate;

                // حساب بدل التذاكر السنوية
                const yearsOfService = totalDays / 365;
                const ticketsAllowance = yearsOfService * ticket * 2; // تذهاب وإياب

                // الإجمالي النهائي
                const totalCompensation = compensationAmount + ticketsAllowance;

                setResults({
                    totalDays,
                    dailyRate: dailyRate.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
                    accruedDays: accruedDays.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
                    compensationAmount: compensationAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
                    ticketsAllowance: ticketsAllowance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
                    totalCompensation: totalCompensation.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
                    years: (totalDays / 365).toFixed(2),
                    ticketCount: (yearsOfService * 2).toFixed(1)
                });
            };

            const exportResults = () => {
                if (!results) return;
                
                const text = `
=== تقرير مستحقات الموظف ===
التاريخ: ${new Date().toLocaleDateString('ar-SA')}

بيانات الخدمة:
- من: ${startDate}
- إلى: ${endDate}
- إجمالي أيام الخدمة: ${results.totalDays}
- سنوات الخدمة: ${results.years}

حسابات الإجازة السنوية:
- الراتب الإجمالي: ${totalSalary} ريال
- قيمة اليوم الواحد: ${results.dailyRate} ريال
- الأيام المستحقة: ${results.accruedDays} يوم
- تعويض الإجازة: ${results.compensationAmount} ريال

بدل التذاكر السنوية:
- سعر التذكرة الواحدة: ${ticketPrice} ريال
- عدد التذاكر المستحقة: ${results.ticketCount} تذكرة
- بدل التذاكر الإجمالي: ${results.ticketsAllowance} ريال

الإجمالي النهائي: ${results.totalCompensation} ريال

---
تم إنشاء هذا التقرير عبر حاسبة الموارد البشرية المحسّنة
                `;
                
                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `hr-report-${new Date().getTime()}.txt`;
                link.click();
                URL.revokeObjectURL(url);
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-5xl mx-auto">
                        
                        {/* Header Section */}
                        <div className="bg-gradient-to-r from-[#1e293b] to-[#334155] rounded-3xl p-8 mb-8 text-white shadow-2xl relative overflow-hidden border-b-8 border-[#d4af37]">
                            <div className="relative z-10 flex flex-col md:flex-row justify-between items-center gap-4">
                                <div className="text-center md:text-right flex-1">
                                    <h1 className="text-4xl font-black mb-2">حاسبة مستحقات الموارد البشرية</h1>
                                    <div className="flex items-center justify-center md:justify-start gap-2 text-[#d4af37] text-lg font-bold">
                                        <Icon name="shieldCheck" className="w-6 h-6" />
                                        <p className="tracking-wide">النسخة المحسّنة - المملكة العربية السعودية</p>
                                    </div>
                                </div>
                                <div className="bg-[#d4af37]/20 p-6 rounded-2xl border-2 border-[#d4af37]/40 hidden md:block">
                                    <Icon name="calculator" className="w-16 h-16 text-[#d4af37]" />
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            {/* Inputs Section */}
                            <div className="bg-white rounded-3xl p-8 shadow-xl border border-slate-200 animate-slide-in">
                                <h2 className="text-2xl font-bold mb-8 flex items-center gap-3 text-[#1e293b]">
                                    <div className="p-3 bg-amber-50 rounded-xl">
                                        <Icon name="userCheck" className="text-[#d4af37] w-6 h-6" />
                                    </div>
                                    بيانات الخدمة
                                </h2>
                                
                                <div className="space-y-6">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-600 mb-2">📅 تاريخ المباشرة</label>
                                        <input 
                                            type="date" 
                                            className="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-[#d4af37] focus:ring-2 focus:ring-[#d4af37]/20 outline-none transition-all text-right font-medium"
                                            value={startDate}
                                            onChange={(e) => setStartDate(e.target.value)}
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-bold text-slate-600 mb-2">📅 تاريخ آخر يوم عمل</label>
                                        <input 
                                            type="date" 
                                            className="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-[#d4af37] focus:ring-2 focus:ring-[#d4af37]/20 outline-none transition-all text-right font-medium"
                                            value={endDate}
                                            onChange={(e) => setEndDate(e.target.value)}
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-bold text-slate-600 mb-2">💰 الراتب الإجمالي</label>
                                        <div className="relative">
                                            <input 
                                                type="number" 
                                                placeholder="مثال: 12000"
                                                className="w-full p-3 pr-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-[#d4af37] focus:ring-2 focus:ring-[#d4af37]/20 outline-none transition-all text-right font-medium"
                                                value={totalSalary}
                                                onChange={(e) => setTotalSalary(e.target.value)}
                                            />
                                            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm font-bold">ر.س</span>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-bold text-slate-600 mb-2">🎫 رصيد الإجازة السنوية</label>
                                        <select 
                                            className="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-[#d4af37] focus:ring-2 focus:ring-[#d4af37]/20 outline-none transition-all appearance-none text-right font-medium"
                                            value={entitlementType}
                                            onChange={(e) => setEntitlementType(e.target.value)}
                                        >
                                            <option value="21">21 يوم (أقل من 5 سنوات)</option>
                                            <option value="30">30 يوم (5 سنوات فأكثر)</option>
                                            <option value="custom">رصيد مخصص (إدخال يدوي)</option>
                                        </select>

                                        {entitlementType === 'custom' && (
                                            <div className="mt-3">
                                                <input 
                                                    type="number" 
                                                    placeholder="أدخل عدد الأيام السنوية"
                                                    className="w-full p-3 bg-amber-50 border-2 border-amber-200 rounded-xl focus:border-[#d4af37] focus:ring-2 focus:ring-[#d4af37]/20 outline-none transition-all text-right font-medium"
                                                    value={customDays}
                                                    onChange={(e) => setCustomDays(e.target.value)}
                                                />
                                            </div>
                                        )}
                                    </div>

                                    <div className="bg-blue-50 p-4 rounded-xl border-2 border-blue-200">
                                        <label className="block text-sm font-bold text-slate-600 mb-2">🎫 سعر التذكرة الواحدة (بدل سنوي)</label>
                                        <div className="relative">
                                            <input 
                                                type="number" 
                                                placeholder="مثال: 500 (للذهاب والعودة)"
                                                className="w-full p-3 pr-4 bg-white border-2 border-blue-300 rounded-xl focus:border-[#d4af37] focus:ring-2 focus:ring-[#d4af37]/20 outline-none transition-all text-right font-medium"
                                                value={ticketPrice}
                                                onChange={(e) => setTicketPrice(e.target.value)}
                                            />
                                            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm font-bold">ر.س</span>
                                        </div>
                                        <p className="text-xs text-slate-500 mt-2 text-right">💡 ستُحسب تلقائياً × 2 (ذهاب + عودة)</p>
                                    </div>

                                    <button 
                                        onClick={calculateVacation}
                                        className="w-full py-4 bg-gradient-to-r from-[#1e293b] to-[#334155] hover:from-[#334155] hover:to-[#475569] text-[#d4af37] font-black rounded-xl shadow-lg transition-all transform active:scale-95 flex items-center justify-center gap-2 text-lg"
                                    >
                                        <Icon name="calculator" className="w-6 h-6" />
                                        توليد التقرير المالي
                                    </button>
                                </div>
                            </div>

                            {/* Results Section */}
                            <div className="space-y-6">
                                {!results ? (
                                    <div className="h-full flex flex-col items-center justify-center bg-white rounded-3xl p-12 border-4 border-dashed border-slate-300 text-slate-400 min-h-[500px]">
                                        <Icon name="calculator" className="w-24 h-24 mb-4 opacity-20" />
                                        <p className="text-xl font-bold mb-2">بانتظار البيانات</p>
                                        <p className="text-sm text-center">أدخل بيانات الخدمة لإتمام حساب المستحقات</p>
                                    </div>
                                ) : (
                                    <div className="space-y-6 animate-slide-in">
                                        {/* Vacation Compensation Card */}
                                        <div className="bg-white p-6 rounded-3xl shadow-lg border-t-4 border-[#d4af37] hover:shadow-xl transition-all">
                                            <div className="flex items-center justify-between mb-4">
                                                <div className="p-3 bg-amber-50 rounded-2xl text-[#d4af37]">
                                                    <Icon name="calendar" className="w-7 h-7" />
                                                </div>
                                                <span className="text-xs font-black text-slate-500 uppercase">الإجازة السنوية</span>
                                            </div>
                                            <div className="mb-3">
                                                <div className="text-3xl font-black text-[#1e293b]">{results.accruedDays}</div>
                                                <div className="text-xs font-medium text-slate-500 mt-1">يوماً</div>
                                            </div>
                                            <div className="bg-amber-50 p-3 rounded-xl">
                                                <div className="text-2xl font-black text-[#d4af37]">{results.compensationAmount}</div>
                                                <div className="text-xs text-slate-500">ريال سعودي</div>
                                            </div>
                                        </div>

                                        {/* Tickets Allowance Card */}
                                        <div className="bg-white p-6 rounded-3xl shadow-lg border-t-4 border-green-500 hover:shadow-xl transition-all">
                                            <div className="flex items-center justify-between mb-4">
                                                <div className="p-3 bg-green-50 rounded-2xl text-green-600">
                                                    <Icon name="ticket" className="w-7 h-7" />
                                                </div>
                                                <span className="text-xs font-black text-slate-500 uppercase">بدل التذاكر</span>
                                            </div>
                                            <div className="mb-3">
                                                <div className="text-3xl font-black text-[#1e293b]">{results.ticketCount}</div>
                                                <div className="text-xs font-medium text-slate-500 mt-1">تذكرة (ذهاب + عودة)</div>
                                            </div>
                                            <div className="bg-green-50 p-3 rounded-xl">
                                                <div className="text-2xl font-black text-green-600">{results.ticketsAllowance}</div>
                                                <div className="text-xs text-slate-500">ريال سعودي</div>
                                            </div>
                                        </div>

                                        {/* Total Compensation Card */}
                                        <div className="bg-gradient-to-br from-[#1e293b] to-[#334155] p-6 rounded-3xl shadow-2xl border-2 border-[#d4af37]">
                                            <div className="flex items-center justify-between mb-4">
                                                <div className="p-3 bg-[#d4af37]/20 rounded-2xl">
                                                    <Icon name="banknote" className="w-7 h-7 text-[#d4af37]" />
                                                </div>
                                                <span className="text-xs font-black text-[#d4af37] uppercase">الإجمالي النهائي</span>
                                            </div>
                                            <div className="text-4xl font-black text-[#d4af37] mb-2">{results.totalCompensation}</div>
                                            <div className="text-sm text-slate-300">ريال سعودي</div>
                                        </div>

                                        {/* Additional Info */}
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                                                <div className="text-xs text-slate-500 font-medium mb-1">قيمة اليوم الواحد</div>
                                                <div className="text-xl font-bold text-[#1e293b]">{results.dailyRate}</div>
                                                <div className="text-xs text-slate-400">ريال</div>
                                            </div>
                                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                                                <div className="text-xs text-slate-500 font-medium mb-1">سنوات الخدمة</div>
                                                <div className="text-xl font-bold text-[#1e293b]">{results.years}</div>
                                                <div className="text-xs text-slate-400">سنة</div>
                                            </div>
                                        </div>

                                        {/* Export Button */}
                                        <button 
                                            onClick={exportResults}
                                            className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition-all transform active:scale-95 flex items-center justify-center gap-2"
                                        >
                                            <Icon name="download" className="w-5 h-5" />
                                            تحميل التقرير
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Notes Section */}
                        <div className="mt-12 bg-white rounded-3xl p-8 border-l-8 border-[#d4af37] shadow-lg">
                            <div className="flex gap-4">
                                <div className="bg-[#d4af37]/20 p-3 rounded-lg mt-1 shrink-0">
                                    <Icon name="info" className="w-6 h-6 text-[#d4af37]" />
                                </div>
                                <div>
                                    <h3 className="font-black text-[#1e293b] mb-3 text-lg">ملاحظات مهنية:</h3>
                                    <ul className="text-sm text-slate-600 leading-relaxed space-y-2">
                                        <li>✓ الحاسبة مبنية على الراتب الإجمالي (أساسي + بدلات) وفق نظام العمل السعودي</li>
                                        <li>✓ الإجازة ال��نوية المستحقة: 21 يوم (أقل من 5 سنوات) أو 30 يوم (5 سنوات فأكثر)</li>
                                        <li>✓ بدل التذاكر السنوية = سعر التذكرة × 2 (ذهاب + عودة) × عدد السنوات</li>
                                        <li>✓ يتم حساب المستحقات بناءً على فترة الخدمة الفعلية بالأيام</li>
                                        <li>⚠️ هذه الحاسبة لأغراض توضيحية ويجب التحقق من النتائج مع قسم الموارد البشرية</li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        {/* Footer Section */}
                        <div className="mt-12 bg-gradient-to-r from-[#1e293b] to-[#334155] rounded-3xl p-8 shadow-2xl flex flex-col md:flex-row items-center justify-between gap-6 border-b-4 border-[#d4af37]">
                            <div className="flex items-center gap-6">
                                <div className="w-16 h-16 bg-[#d4af37]/20 rounded-2xl flex items-center justify-center text-[#d4af37] shadow-xl border-2 border-[#d4af37]/40">
                                    <Icon name="user" className="w-8 h-8" />
                                </div>
                                <div className="text-right text-white">
                                    <h3 className="text-lg font-bold leading-tight mb-1">حاسبة الموارد البشرية المحسّنة</h3>
                                    <p className="text-sm text-slate-300">نسخة محدثة مع دعم بدل التذاكر السنوية</p>
                                </div>
                            </div>
                            <div className="text-center md:text-right text-white">
                                <p className="text-xs font-medium text-slate-400">تم التطوير بواسطة Moaz Omar Anis AboElemam</p>
                                <p className="text-xs text-slate-500 mt-1">2024</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
